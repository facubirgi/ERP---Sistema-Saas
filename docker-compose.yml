# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
    name: saas_postgres_data
  # redis_data:
  #   driver: local
  #   name: saas_redis_data

# Custom network for inter-service communication
networks:
  saas_network:
    driver: bridge
    name: saas_network
    ipam:
      config:
        - subnet: 172.20.0.0/16